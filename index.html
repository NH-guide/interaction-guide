<style>
:root{
  --blue:#664FFF;
  --blue-dark:#4B31F8;
  --blue-bg:#F2F0FF;
  --blue-line:#CDC6FF;
  --ink:#1a1a1a;
  --sub:#565b64;
  --line:#e5e5e5;
  --bg:#fafafa;
  --green:#1f9d61;
  --green-bg:#e9f7f0;
  --orange:#e08e2e;
  --orange-bg:#fff8f0;
}
*{margin:0;padding:0;box-sizing:border-box}
html{background:var(--bg)}
body{
  min-width:320px;
  background:var(--bg);
  color:var(--ink);
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;
  font-size:15px;
  font-weight:400;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.skip-link{
  position:fixed;
  left:16px;
  top:8px;
  z-index:999;
  transform:translateY(-160%);
  padding:9px 14px;
  border-radius:9px;
  background:var(--ink);
  color:#fff;
  font-size:13px;
  font-weight:700;
  text-decoration:none;
}
.skip-link:focus{transform:none}
.topbar{
  position:sticky;
  top:0;
  z-index:10;
  padding:0;
  border-bottom:1px solid var(--line);
  background:rgba(250,250,250,.95);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
}
.topbar-in{
  display:flex;
  align-items:center;
  width:100%;
  max-width:760px;
  min-height:60px;
  margin:0 auto;
  padding:0 20px;
}
.topbar-in img{
  display:block;
  width:120px;
  height:16px;
  object-fit:contain;
}
.logo-link{
  display:block;
  flex:0 0 120px;
  width:120px;
  height:16px;
  line-height:0;
  cursor:pointer;
  transition:opacity .15s ease;
}
.logo-link:hover{opacity:.86}
.wrap{
  width:100%;
  max-width:760px;
  margin:0 auto;
  padding:0 20px 80px;
}
.guide-card{
  margin-top:18px;
  overflow:hidden;
  border:1px solid rgba(102,79,255,.45);
  border-radius:18px;
  background:#fff;
  box-shadow:0 18px 52px rgba(102,79,255,.05);
}
.guide-intro{
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  padding:36px 44px;
  border-bottom:1px solid rgba(102,79,255,.16);
  background:rgba(102,79,255,.08);
}
.badge{
  display:inline-flex;
  align-items:center;
  align-self:flex-start;
  padding:3px 12px;
  border-radius:999px;
  background:#fff;
  color:var(--blue-dark);
  font-size:12px;
  font-weight:700;
  line-height:1.6;
}
.guide-intro h1{
  margin-top:25px;
  font-size:36px;
  font-weight:700;
  line-height:1.25;
  letter-spacing:-.035em;
  word-break:keep-all;
}
.guide-list{
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:10px;
  padding:36px 44px;
}
.kit-card{
  display:grid;
  grid-template-columns:44px minmax(0,1fr);
  gap:0 15px;
  align-items:center;
  padding:14px 18px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#fff;
  color:var(--ink);
  text-decoration:none;
  transition:border-color .15s ease,background .15s ease;
}
.kit-card:hover{
  border-color:var(--blue-line);
  background:#fefeff;
}
.kit-card:focus-visible{
  outline:3px solid rgba(102,79,255,.32);
  outline-offset:3px;
}
.kit-number{
  grid-row:1 / span 2;
  display:flex;
  align-items:center;
  justify-content:center;
  width:32px;
  height:32px;
  border-radius:10px;
  background:var(--blue-bg);
  color:var(--blue-dark);
  font-size:13px;
  font-weight:800;
}
.kit-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  min-width:0;
}
.kit-head h2{
  min-width:0;
  font-size:18px;
  font-weight:700;
  line-height:1.35;
  letter-spacing:-.025em;
  word-break:keep-all;
}
.time-badge{
  display:inline-flex;
  flex:none;
  align-items:center;
  gap:5px;
  padding:3px 12px;
  border-radius:999px;
  background:var(--green-bg);
  color:var(--green);
  font-size:12px;
  font-weight:700;
  line-height:1.6;
  white-space:nowrap;
}
.time-badge svg{
  display:block;
  width:14px;
  height:14px;
}
.kit-desc{
  margin-top:5px;
  color:#5A6172;
  font-size:13.5px;
  font-weight:400;
  line-height:1.55;
  word-break:keep-all;
}
.btn{
  display:block;
  width:100%;
  min-height:48px;
  padding:12px;
  border:0;
  border-radius:14px;
  font-family:inherit;
  font-size:16px;
  font-weight:700;
  text-align:center;
}
.footnote{
  margin:31px 0 0;
  color:#7C7C8B;
  font-size:12px;
  font-weight:400;
  text-align:center;
}
@media(max-width:900px){
  .guide-intro{padding:32px 36px}
  .guide-list{padding:32px 36px}
}
@media(max-width:560px){
  .topbar-in,.wrap{padding-right:12px;padding-left:12px}
  .topbar-in{min-height:51px}
  .guide-card{margin-top:6px}
  .guide-intro{padding:30px 24px 32px}
  .guide-intro h1{margin-top:20px;font-size:29px}
  .guide-list{padding:24px 18px}
  .kit-card{grid-template-columns:32px minmax(0,1fr);gap:0 12px;padding:16px 14px}
  .kit-number{width:32px}
  .kit-head{align-items:flex-start;flex-direction:column;gap:7px}
  .kit-head h2{font-size:18px}
}
@media(prefers-reduced-motion:reduce){
  .kit-card{transition:none}
}

<script>
const WEBHOOK_URL = '';
const LS_KEY = 'nh_index';

/* 상태·측정 (3킷 공통 모듈 v1 · 목차 규격) */
const KIT = 'index';
const qs = new URLSearchParams(location.search);
/* src 우선, 없으면 UTM 폴백 */
const SRC = qs.get('src') || qs.get('utm_campaign') || qs.get('utm_source') || 'direct';
const CID = qs.get('cid') || '';

function newId(p){ return p + Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4); }
function storedId(store, key, prefix){
  try{
    let v = store.getItem(key);
    if(!v){ v = newId(prefix); store.setItem(key, v); }
    return v;
  }catch(e){ return newId(prefix); }
}
const VID = storedId(localStorage, 'nh_kit_vid', 'v_');
const SID = storedId(sessionStorage, 'nh_kit_sid', 's_');
const T0 = Date.now();

let state = load();
function load(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)) || {} }catch(e){ return {} } }
function save(){ state.updated = new Date().toISOString(); try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }

function track(ev, extra){
  const payload = Object.assign({
    event:ev, kit:KIT, vid:VID, session_ref:SID,
    src:SRC, company:CID,
    elapsed:Math.round((Date.now()-T0)/1000), ts:Date.now()
  }, extra || {});
  console.log('[track]', payload);
  (window.dataLayer = window.dataLayer || []).push(payload);
  if(WEBHOOK_URL){ try{ navigator.sendBeacon(WEBHOOK_URL, JSON.stringify(payload)); }catch(e){} }
}

/* 다음 킷 이동: src와 cid를 이어붙여 여정을 유지한다. */
function nextKitUrl(base){
  const p = new URLSearchParams();
  if(SRC && SRC !== 'direct') p.set('src', SRC);
  if(CID) p.set('cid', CID);
  const s = p.toString();
  return base + (s ? (base.indexOf('?') >= 0 ? '&' : '?') + s : '');
}
function goNextKit(target, url){
  track('click_next_kit', {to:target});
  location.href = nextKitUrl(url);
}
</script>
