<style>
:root{
  --blue:#664FFF; --blue-dark:#4B31F8; --blue-bg:#F2F0FF; --blue-line:#CDC6FF;
  --ink:#1a1a1a; --sub:#565b64; --line:#e5e5e5; --bg:#fafafa;
  --green:#1f9d61; --green-bg:#e9f7f0; --orange:#e08e2e; --orange-bg:#fff8f0;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 80px}
@media(min-width:900px){h1{font-size:32px}h2{font-size:22px}.card{padding:34px 38px}}

/* ── 상단 바 ── */
.topbar{position:sticky;top:0;z-index:10;background:rgba(250,250,250,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:14px 16px}
.topbar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px}
.logo-link{display:block;flex:0 0 120px;width:120px;height:16px;line-height:0;cursor:pointer;transition:opacity .15s ease}
.logo-link:hover{opacity:.86}
.logo-link>img{display:block;width:120px;height:16px;object-fit:contain}

/* ── 화면(카드) ── */
.scr{display:none;animation:fade .3s}
.scr.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px 22px;margin-top:16px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.step-tag{display:inline-block;background:var(--blue-bg);color:var(--blue-dark);font-size:12px;font-weight:700;border-radius:20px;padding:3px 12px;margin-bottom:12px}
h1{font-size:26px;line-height:1.35;margin-bottom:12px}
h2{font-size:20px;line-height:1.4;margin-bottom:10px}
.sub{color:var(--sub);font-size:15px;margin-bottom:6px}

/* 실행법 리스트 */
.acts{margin:12px 0 4px}
.act{display:flex;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
.act:last-child{border-bottom:none}
.act .no{flex:none;width:26px;height:26px;border-radius:50%;background:var(--blue-bg);color:var(--blue-dark);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;margin-top:2px}
.act b{font-weight:600}
.act small{display:block;color:var(--sub);font-size:13px}
.path{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:6px;font-size:12.5px;padding:1px 7px;color:var(--sub)}

/* 처방 카드 */
.rx{border:1.5px solid var(--blue-line);border-radius:14px;padding:18px 18px 14px;margin:16px 0;background:#fff}
.rx-head{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.rx-no{flex:none;background:var(--blue);color:#fff;font-size:12.5px;font-weight:700;border-radius:14px;padding:3px 12px}
.rx-title{font-size:17px;font-weight:800}
.rx-why{font-size:13.5px;color:var(--sub);margin:2px 0 4px}
.rx.bonus{border-style:dashed;border-color:var(--line)}
.guide-link{display:inline-block;margin-top:8px;font-size:13px;color:var(--blue-dark);font-weight:600;text-decoration:none}
.guide-link:hover{text-decoration:underline}

/* 템플릿 복붙 (토글) */
details{border:1px solid var(--line);border-radius:12px;margin:12px 0;background:#fff}
details summary{cursor:pointer;padding:12px 14px;font-size:14px;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
details summary::-webkit-details-marker{display:none}
details summary::after{content:'▾';margin-left:auto;color:var(--sub);transition:.2s}
details[open] summary::after{transform:rotate(180deg)}
details .inner{padding:0 14px 14px}
.tmpl{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;margin:8px 0;white-space:pre-wrap;font-size:12.5px;line-height:1.55}
.copy-mini{background:#fff;border:1px solid var(--blue-line);color:var(--blue-dark);border-radius:8px;font-size:12px;padding:4px 10px;cursor:pointer;margin-top:2px;font-family:inherit}
.copy-mini:active{background:var(--blue-bg)}

/* 콜아웃 */
.callout{border-radius:12px;padding:14px 16px;font-size:14px;margin:14px 0}
.callout.blue{background:var(--blue-bg);border:1px solid var(--blue-line)}
.callout.green{background:var(--green-bg);border:1px solid #bfe6d2}
.qa2{margin:8px 0 0;padding-left:18px;font-size:13.5px}
.qa2 li{padding:2px 0;color:var(--sub)}
.qa2 li b{color:#462EDF}

/* 버튼 */
.btn{display:block;width:100%;border:none;border-radius:12px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;margin-top:10px;font-family:inherit;text-align:center;text-decoration:none;transition:.15s}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-dark)}
.btn-ghost{background:#fff;color:var(--blue-dark);border:1.5px solid var(--blue-line)}
.btn-ghost:hover{background:var(--blue-bg)}
.textlink{display:inline-block;margin-top:14px;font-size:13px;color:var(--sub);text-decoration:underline;cursor:pointer;background:none;border:none;font-family:inherit}

/* 진단 체크리스트 */
.chkrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin:8px 0;font-size:14px;cursor:pointer;background:#fff}
.chkrow input{width:18px;height:18px;accent-color:var(--blue)}
.chkrow.on{border-color:var(--blue);background:var(--blue-bg)}
.chkrow small{color:var(--sub);font-size:12.5px;margin-left:auto}

/* 이미 하는 중 칩 (헤더 오른쪽 정렬) */
.done-chips{display:flex;flex-wrap:wrap;gap:5px;margin-left:auto;justify-content:flex-end}
.chip{background:var(--green-bg);border:1px solid #bfe6d2;color:var(--green);font-size:10.5px;font-weight:600;border-radius:12px;padding:1px 8px}
.rx-count{font-size:13px;font-weight:600;color:var(--sub)}

/* 처방 내부 스텝 (A-1 서브스텝 패턴) */
.substep{display:none;animation:fade .25s}
.substep.on{display:block}
.sub-lab{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:800;color:var(--ink);margin:16px 0 6px}
.sub-num{flex:none;background:var(--blue);color:#fff;font-size:12.5px;font-weight:700;border-radius:14px;padding:3px 12px}
.sub-nav{display:flex;gap:10px}
.sub-nav .btn{margin-top:12px}
.sub-nav .btn.prev{flex:0 0 96px}

/* 스크린샷 */
.shot{width:100%;border:1px solid var(--line);border-radius:12px;margin:12px 0 4px;display:block}

.finish-emoji{font-size:44px;text-align:center;margin:6px 0 10px}
.center{text-align:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;padding:10px 18px;border-radius:24px;opacity:0;pointer-events:none;transition:.3s;z-index:99}
.toast.show{opacity:.95}
.footnote{margin-top:26px;font-size:12px;color:#a0a4ab;text-align:center}
hr.div{border:none;border-top:1px solid var(--line);margin:22px 0 6px}

/* ═══════════ 고객 공유용 경험 개선 ═══════════ */
:root{
  --blue:#664FFF; --blue-dark:#482EF6; --blue-bg:#F4F2FF; --blue-line:#D6D0FF;
  --ink:#15151F; --sub:#595968; --line:#E5E5EF; --bg:#F6F6FB;
  --green:#167A4B; --green-bg:#EAF7F0; --orange:#B96717; --orange-bg:#FFF5E9;
  --shadow:0 18px 50px rgba(42,31,92,.09); --soft-shadow:0 8px 24px rgba(42,31,92,.07);
}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{min-height:100vh;background:var(--bg);word-break:keep-all;overflow-wrap:break-word}
button,a,summary,input{ -webkit-tap-highlight-color:transparent }
button{touch-action:manipulation}
.skip-link{position:fixed;left:16px;top:8px;z-index:999;transform:translateY(-160%);background:var(--ink);color:#fff;padding:9px 14px;border-radius:9px;font-size:13px;font-weight:700;text-decoration:none}
.skip-link:focus{transform:none}
.wrap{max-width:1120px;padding:0 18px 72px}

/* 상단에서 전체 흐름을 잃지 않게 해요 */
.topbar{padding:0 18px;background:rgba(247,246,251,.88);border-color:rgba(223,219,234,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.topbar-in{max-width:1120px;min-height:62px;gap:16px}
.phase-nav{display:flex;align-items:center;gap:8px;margin-left:auto;color:#80808F;font-size:12px;white-space:nowrap}
.phase{display:flex;align-items:center;gap:6px;font-weight:650}
.phase i{display:grid;place-items:center;width:22px;height:22px;border:1px solid #D3D3E2;border-radius:50%;background:#fff;font-size:11px;font-style:normal;transition:.25s ease}
.phase.active{color:var(--blue-dark)}
.phase.active i{border-color:var(--blue);background:var(--blue);color:#fff;box-shadow:0 0 0 4px rgba(102,79,255,.11)}
.phase.done i{border-color:var(--green);background:var(--green);color:#fff}
.phase-line{width:26px;height:1px;background:#D3D3E2}

/* 화면과 큰 카드 */
.scr{animation:screenIn .42s cubic-bezier(.2,.75,.25,1)}
@keyframes screenIn{from{opacity:0;transform:translateY(12px) scale(.992)}to{opacity:1;transform:none}}
.card{border-color:rgba(224,220,233,.92);border-radius:24px;box-shadow:var(--shadow)}
.step-tag{letter-spacing:-.01em;background:var(--blue-bg);border:1px solid rgba(102,79,255,.12);color:var(--blue-dark)}
h1{letter-spacing:-.035em;word-break:keep-all}
h2{letter-spacing:-.025em}
.sub{line-height:1.7}
.eyebrow{display:block;margin-bottom:10px;color:var(--blue-dark);font-size:12px;font-weight:800;letter-spacing:.04em}

/* 진단: 소개와 질문을 분리해 첫 화면의 부담을 낮춰요 */
.diag-card{overflow:hidden;padding:0}
.diag-intro{position:relative;padding:32px 26px 26px;background:#F5F5FF}
.diag-intro::after{content:none}
.diag-intro>*{position:relative;z-index:1}
.diag-intro h1{margin-bottom:12px}
.diag-form{padding:24px 22px 26px}
.diag-field{min-width:0;border:0}
.diag-question{margin-bottom:4px;font-size:17px;font-weight:800;line-height:1.45;letter-spacing:-.02em}
.diag-hint{display:block;margin:3px 0 15px;color:var(--sub);font-size:12.5px;font-weight:450}
.chkrow{position:relative;align-items:flex-start;min-height:54px;margin:8px 0;padding:12px 13px;border-color:var(--line);border-radius:13px;line-height:1.4;transition:border-color .18s ease,background .18s ease,transform .18s ease,box-shadow .18s ease}
.chkrow:hover{border-color:#C2C2DD;background:#FBFBFF}
.chkrow:active{transform:scale(.992)}
.chkrow.on{border-color:var(--blue);background:var(--blue-bg);box-shadow:0 0 0 3px rgba(102,79,255,.08)}
.chkrow input{display:grid;flex:0 0 auto;place-content:center;width:21px;height:21px;margin-top:1px;appearance:none;border:1.5px solid #A3A3B6;border-radius:6px;background:#fff;cursor:pointer;transition:.18s ease}
.chkrow input::before{content:'';width:9px;height:5px;border:solid #fff;border-width:0 0 2px 2px;transform:rotate(-45deg) scale(0);transition:transform .15s ease}
.chkrow input:checked{border-color:var(--blue);background:var(--blue)}
.chkrow input:checked::before{transform:rotate(-45deg) scale(1)}
.chk-copy{display:block;min-width:0;padding-top:1px;font-weight:590}
.chkrow small{display:block;margin:3px 0 0;color:var(--sub);font-size:11.5px;line-height:1.45}
.chkrow[data-ch="none"]{margin-top:13px;border-style:dashed}
.required-badge{flex:0 0 auto;margin-left:auto;padding:2px 8px;border-radius:20px;background:#FDECEC;color:#D64545;font-size:10.5px;font-weight:800;line-height:1.5}
.chkrow[data-ch="none"].on{border-color:#D64545;background:#FFF1F1;box-shadow:0 0 0 3px rgba(214,69,69,.11)}
.chkrow[data-ch="none"] input:checked{border-color:#D64545;background:#D64545}
.diag-help{min-height:21px;margin:12px 2px 2px;color:var(--sub);font-size:12.5px}
.diag-help strong{color:var(--blue-dark)}

/* 버튼과 포커스 */
.btn{min-height:52px;border-radius:13px;transition:transform .16s ease,background .16s ease,box-shadow .16s ease,opacity .16s ease}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(1px) scale(.995)}
.btn-primary{background:var(--blue);box-shadow:0 8px 20px rgba(102,79,255,.23)}
.btn-primary:hover{background:var(--blue-dark);box-shadow:0 10px 24px rgba(102,79,255,.28)}
.btn-ghost{border-color:#CAC2FF;background:#fff}
.btn.is-loading{pointer-events:none;opacity:.82}
.btn.is-loading::before{content:'';display:inline-block;width:13px;height:13px;margin-right:8px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;vertical-align:-2px;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
:where(button,a,summary,input,[role="button"]):focus-visible{outline:3px solid rgba(102,79,255,.32);outline-offset:3px}

/* 결과 요약 + 단계 지도 */
.result-shell{display:grid;gap:16px;margin-top:16px}
.result-side{min-width:0}
.result-summary{padding:23px 20px;border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:var(--soft-shadow)}
.result-summary h1{margin-bottom:8px;font-size:22px}
.result-summary .sub{font-size:13.5px}
.result-summary .textlink{min-height:40px;margin-top:10px;padding:8px 0}
.done-chips{justify-content:flex-start;margin:14px 0 0;gap:6px}
.chip{padding:4px 9px;border-radius:20px;font-size:10.5px;line-height:1.35}
.rx-count{display:block;margin-top:12px;color:var(--ink);font-size:13px}
.stepper{display:flex;gap:7px;margin-top:12px;overflow:auto;padding:2px 2px 8px;scrollbar-width:thin}
.step-node{display:flex;flex:0 0 auto;align-items:center;gap:8px;min-height:44px;padding:8px 11px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--sub);font-family:inherit;text-align:left;cursor:pointer;transition:.18s ease}
.step-node:hover{border-color:var(--blue-line);background:#F9F9FF}
.step-index{display:grid;flex:0 0 auto;place-items:center;width:24px;height:24px;border-radius:50%;background:#EEEEF4;color:#717180;font-size:11px;font-weight:800}
.step-copy{display:none;line-height:1.25}
.step-copy strong,.step-copy small{display:block}
.step-copy strong{color:inherit;font-size:12.5px}
.step-copy small{max-width:180px;margin-top:2px;overflow:hidden;color:#817B89;font-size:10.5px;text-overflow:ellipsis;white-space:nowrap}
.step-node.active{border-color:var(--blue);background:var(--blue-bg);color:var(--blue-dark);box-shadow:0 0 0 3px rgba(102,79,255,.08)}
.step-node.active .step-index{background:var(--blue);color:#fff}

.result-card{margin-top:0;padding:20px 18px 22px}
.result-kicker{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.result-kicker .step-tag{margin:0}
.sub-lab{align-items:flex-start;margin:0 0 14px;font-size:22px;line-height:1.35}
.sub-num{margin-top:2px;white-space:nowrap;box-shadow:0 5px 12px rgba(102,79,255,.18)}
.substep{animation:panelIn .28s cubic-bezier(.2,.75,.25,1)}
@keyframes panelIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}

/* 이유를 먼저, 행동과 참고자료를 다음으로 읽히게 해요 */
.rx{margin:0;padding:0;border:0;background:transparent}
.rx.bonus{padding:14px;border:1.5px dashed #C0C0D6;border-radius:16px;background:#FCFBFD}
.action-block{padding:16px;border:1px solid rgba(102,79,255,.16);border-radius:16px;background:rgba(102,79,255,.06)}
.action-kicker{display:flex;align-items:center;gap:7px;margin-bottom:9px;color:#664FFF;font-size:12px;font-weight:850;letter-spacing:.03em}
.acts{margin:0}
.act{gap:11px;padding:11px 0;border-color:#D9D9EC;line-height:1.55}
.act:first-child{padding-top:3px}
.act:last-child{padding-bottom:2px}
.act .no{background:#fff;box-shadow:0 2px 7px rgba(63,48,125,.08)}
.act .no.bullet{width:14px;background:transparent;box-shadow:none;color:var(--blue-dark);font-size:18px}
.act small{margin-top:3px;line-height:1.55}
.why-card{display:grid;grid-template-columns:auto 1fr;gap:10px;margin:13px 0;padding:12px 13px;border-radius:13px;background:#F6F6F9;color:var(--sub);font-size:13px}
.why-card::before{content:'💡';line-height:1.5}
.why-card b{display:block;margin-bottom:2px;color:var(--ink);font-size:11.5px}
.rx-why{margin:0;color:var(--sub);font-size:13px;line-height:1.65}
.visual-step{margin-bottom:14px}
.visual-step .acts{padding:15px 15px 9px;border:1px solid #E2DEFF;border-bottom:0;border-radius:16px 16px 0 0;background:#F6F6FF}
.visual-step .shot{margin:0;border-radius:0 0 16px 16px}
.shot{margin:13px 0 5px;border-color:#D9D9E7;border-radius:14px;background:#F0F0F5;cursor:zoom-in;transition:transform .18s ease,box-shadow .18s ease}
.shot-svg{margin:13px 0 5px;padding:0;overflow:hidden;border:1px solid rgba(102,79,255,.16);border-radius:16px;cursor:zoom-in}
.visual-step .shot-svg{margin:0;border-radius:0 0 16px 16px}
.shot-svg svg{display:block;width:100%;height:auto}
.shot:hover{transform:translateY(-1px);box-shadow:var(--soft-shadow)}
.shot[role="button"]{outline-offset:4px}
.shot-carousel{position:relative;overflow:hidden;cursor:default}
.carousel-track{display:flex;transition:transform .35s ease}
.carousel-slide{flex:0 0 100%;min-width:0;aspect-ratio:1275/750;background:#fff}
.carousel-image{display:block;width:100%;height:100%;object-fit:contain;cursor:zoom-in}
.carousel-wrap{position:relative;margin:13px 0 5px}
.carousel-wrap .shot{margin:0}
.carousel-arrow{position:absolute;top:50%;z-index:2;display:grid;place-items:center;width:40px;height:40px;border:1px solid #E2DEFF;border-radius:50%;background:#fff;color:#664FFF;cursor:pointer;box-shadow:0 4px 14px rgba(42,31,92,.16);transform:translateY(-50%);transition:.16s ease}
.carousel-arrow svg{display:block}
.carousel-arrow.prev{left:-20px}
.carousel-arrow.next{right:-20px}
.carousel-arrow:hover:not(:disabled){background:#F3F3FF}
.carousel-arrow:disabled{opacity:.35;cursor:default}
.carousel-caption{margin:9px 2px 0;color:var(--sub);font-size:12.5px;text-align:center}
.slide-deck{position:relative}
.deck-slide{display:none;animation:fade .25s}
.deck-slide.on{display:block}
.deck-slide .visual-step{margin-bottom:0}
.visual-step.no-img .acts{border-bottom:1px solid #E2DEFF;border-radius:16px}
.portal-flow{display:block;width:100%;height:auto;margin:14px 0 4px}
.portal-flow text{font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif}
.btn:disabled{opacity:.4;cursor:default;transform:none;box-shadow:none}
@media(max-width:560px){.carousel-arrow{width:34px;height:34px}.carousel-arrow.prev{left:-8px}.carousel-arrow.next{right:-8px}}

.step-subchip{display:flex;align-items:center;gap:7px;width:100%;min-height:30px;padding:5px 9px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--sub);font-family:inherit;font-size:10.5px;line-height:1.4;text-align:left;cursor:pointer;transition:.16s ease}

/* ═══════════ 상태·측정 (3킷 공통 모듈 v1 · KIT 값만 킷마다 다름) ═══════════ */
const KIT = 'dispatch';                                  // create | dispatch | connect
const qs  = new URLSearchParams(location.search);
/* src 우선, 없으면 UTM 폴백 — UTM만 달아 배포해도 캠페인이 잡히도록 */
const SRC = qs.get('src') || qs.get('utm_campaign') || qs.get('utm_source') || 'direct';
const CID = qs.get('cid') || '';

function newId(p){ return p + Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4); }
function storedId(store, key, prefix){
  try{
    let v = store.getItem(key);
    if(!v){ v = newId(prefix); store.setItem(key, v); }
    return v;
  }catch(e){ return newId(prefix); }
}
const VID = storedId(localStorage,   'nh_kit_vid', 'v_');   // 방문자 (3킷 공유·같은 오리진)
const SID = storedId(sessionStorage, 'nh_kit_sid', 's_');   // 세션 (탭 1회)
const T0  = Date.now();

let state = load();
function load(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)) || {} }catch(e){ return {} } }
function save(){ state.updated = new Date().toISOString(); try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }

/* dataLayer로 GTM에 전달. cid·sid는 GA4 예약어라 company·session_ref로 이름을 바꿔 담는다. */
function track(ev, extra){
  const payload = Object.assign({
    event: ev, kit: KIT, vid: VID, session_ref: SID,
    src: SRC, company: CID,
    elapsed: Math.round((Date.now()-T0)/1000), ts: Date.now()
  }, extra||{});
  console.log('[track]', payload);
  (window.dataLayer = window.dataLayer||[]).push(payload);
  if(WEBHOOK_URL){ try{ navigator.sendBeacon(WEBHOOK_URL, JSON.stringify(payload)); }catch(e){} }
}

/* 완료는 1회만 */
let kitCompleted = false;
function trackComplete(){
  if(kitCompleted) return;
  kitCompleted = true;
  track('kit_complete');
}

/* 다음 킷 이동 — src·cid를 이어붙여 여정 유지 */
function nextKitUrl(base){
  const p = new URLSearchParams();
  if(SRC && SRC !== 'direct') p.set('src', SRC);
  if(CID) p.set('cid', CID);
  const s = p.toString();
  return base + (s ? (base.indexOf('?') >= 0 ? '&' : '?') + s : '');
}
function goNextKit(target, url){
  track('click_next_kit', {to: target});
  location.href = nextKitUrl(url);
}

/* ═══════════ 진단 → 처방 ═══════════ */
function checked(){
  return [...document.querySelectorAll('.chkrow input:checked')].map(i=>i.closest('.chkrow').dataset.ch);
}
function prescribe(){
  const submit = document.getElementById('diagSubmit');
  if(submit.getAttribute('aria-busy')==='true') return;
  submit.dataset.label = submit.innerHTML;
  submit.setAttribute('aria-busy','true');
  submit.classList.add('is-loading');
  submit.textContent = '처방을 맞추고 있어요';

  const done = checked().filter(c=>c!=='none');
  state.done = done; save();
  track('diag_submit', {done: done.join(',')||'none'});

  /* 이미 하는 중 칩 */
  const names = {jobkorea:'잡코리아', otherportal:'타 채용 플랫폼', careersite:'채용 홈페이지', link:'웹사이트 링크', snscomm:'SNS·커뮤니티'};

    ? done.length+'가지는 이미 하고 계세요. 남은 할 일을 효과가 큰 순서로 안내해요. 아래 단계를 차례로 진행하세요.'
    : '효과가 큰 순서로 3가지 방법을 안내해요. 첫 번째 단계부터 차례로 진행하세요.';

  /* 내부 스텝 패널 구성: 처방 1~3 (필요 시 '링크 복사' 삽입) → (보너스) → 마무리 → 커넥트 */

  connectViewed = false;

    todo.forEach((r,i)=>{
      const num = i+1;
      if(r.ch==='otherportal'){
        const groupTitle = '다양한 채용 플랫폼에 공고 게시하기';
        rxPanels.push({chip:'처방 '+num, lab:groupTitle, badge:true, group:num, el: portalCoverPanel()});
        const subs = [['홈페이지 지원 방식', portalHomePanel()], ['즉시 지원 방식', portalInstantMethodPanel()]];
        const subTags = [['잡코리아','사람인','알바몬','게임잡'], ['원티드','원픽','리멤버','잡코리아','사람인']];
        subs.forEach((s,si)=>rxPanels.push({chip:'처방 '+num, lab:groupTitle, badge:true, group:num, subNum:num+'-'+(si+1), subName:s[0], subLabel:num+'-'+(si+1)+' · '+s[0], subTags:subTags[si], el:s[1]}));
      }else if(r.ch==='snscomm'||r.ch==='link'){
        const isBadge = r.ch==='jobkorea'||r.ch==='careersite';
        const subs = [['모집 링크 복사해 두기', prepPanel()],[r.short, rxCard(r, num)]];
        subs.forEach((s,si)=>rxPanels.push({chip:'처방 '+num, lab:r.title, badge:isBadge, group:num, subNum:num+'-'+(si+1), subName:s[0], subLabel:num+'-'+(si+1)+' · '+s[0], el:s[1]}));
      }else{
        rxPanels.push({chip:'처방 '+num, lab:r.title, badge:r.ch==='jobkorea'||r.ch==='careersite', el: rxCard(r, num)});
      }
    });
  }else{
    rxPanels.push({chip:'점검', lab:'공고 다듬기', el: fallbackPanel()});
  }
  if(todo.length) rxPanels.push({chip:'마무리', lab:'오늘 할 일을 마쳤어요', kind:'finish', el: finishPanel()});
  rxPanels.push({chip:'한 걸음 더', lab:'커넥트로 지원자 모으기', heading:'여러 플랫폼의 지원자를 나인하이어로 모으기', kind:'connect', el: connectPanel()});

  /* 렌더 */
  const list = document.getElementById('rxList');
  list.innerHTML = '';
  rxPanels.forEach((p,i)=>{
    const wrap = document.createElement('div');
    wrap.className = 'substep'+(p.kind==='finish'?' substep--finish':''); wrap.id = 'rxsub'+i;
    p.el.classList.add('panel-content');
    wrap.appendChild(p.el);
    const bottom = document.createElement('div'); bottom.className = 'panel-bottom';
    const guide = [...p.el.children].find(el=>el.classList.contains('guide-link'));
    if(guide) bottom.appendChild(guide);
    const nav = document.createElement('div'); nav.className = 'sub-nav';
    const deckLen = p.el.querySelectorAll('.deck-slide').length;
    if(i>0||deckLen>1) nav.innerHTML += '<button type="button" class="btn btn-ghost prev" onclick="navPrev('+i+')">← 이전</button>';
    if(p.kind==='connect') nav.innerHTML += '<button type="button" class="btn btn-ghost" onclick="rediagnose()">다시 진단하기</button>';
    if(i<rxPanels.length-1&&!p.ownNext){
      nav.innerHTML += '<button type="button" class="btn btn-primary" onclick="navNext('+i+')">'+(deckLen>1?'다음 →':(nextPanelLabel(i)||'다음 →'))+'</button>';
    }
    if(nav.children.length) bottom.appendChild(nav);
    if(bottom.children.length) wrap.appendChild(bottom);
    list.appendChild(wrap);
  });

  renderStepper();
  enhanceShots(list);
  initCarousels(list);

  track('prescribe', {cards: todo.map(r=>r.ch).join(',')||'none', bonus: done.includes('otherportal')});
  const reveal = ()=>{
    show('result');
    rxsub(0);
    requestAnimationFrame(()=>document.getElementById('resultTitle').focus({preventScroll:true}));
    submit.removeAttribute('aria-busy');
    submit.classList.remove('is-loading');
    submit.innerHTML = submit.dataset.label;
  };
  setTimeout(reveal, reduceMotion.matches ? 0 : 220);
}
let rxPanels = [];
let currentRx = 0;
let visitedPanels = new Set();
let rxRevealed = false;
let connectViewed = false;
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
function rxScrollTo(){
  let y = 0;
  if(rxRevealed && window.matchMedia('(max-width:899px)').matches){
    const rxCard = document.querySelector('.result-card');
    const rxBar = document.querySelector('.topbar');
    if(rxCard) y = Math.max(0, rxCard.getBoundingClientRect().top + window.pageYOffset - (rxBar ? rxBar.offsetHeight : 0) - 8);
  }
  window.scrollTo({top:y,behavior:reduceMotion.matches?'auto':'smooth'});
}
function renderStepper(){
  const stepper = document.getElementById('rxStepper');
  stepper.innerHTML = '';
  visitedPanels = new Set();
  rxRevealed = false;
  const topItems = [];
  rxPanels.forEach((p,i)=>{
    const last = topItems[topItems.length-1];
    if(p.group!=null && last && last.group===p.group){ last.subs.push(i); }
    else topItems.push({group:p.group!=null?p.group:null, chip:p.chip, lab:p.lab, subs:[i]});
  });
  topItems.forEach((item,t)=>{
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'step-node';
    button.dataset.panels = item.subs.join(',');
    button.dataset.num = t+1;
    button.setAttribute('aria-label',(t+1)+'단계, '+item.chip+(item.lab ? ', '+item.lab : ''));
    button.innerHTML = '<span class="step-index" aria-hidden="true">'+(t+1)+'</span><span class="step-copy"><strong>'+item.chip+'</strong><small>'+(item.lab||'오늘 할 일 마치기')+'</small></span>';
    button.addEventListener('click',()=>rxsub(item.subs[0]));
    stepper.appendChild(button);
    if(item.subs.length>1){
      const subwrap = document.createElement('div');
      subwrap.className = 'step-subs';
      subwrap.hidden = true;
      item.subs.forEach(pi=>{
        if(!rxPanels[pi].subNum) return;
        const chipBtn = document.createElement('button');
        chipBtn.type = 'button';
        chipBtn.className = 'step-subchip';
        chipBtn.dataset.step = pi;
        chipBtn.innerHTML = '<span class="step-sub-index">'+rxPanels[pi].subNum+'</span><span class="step-sub-label">'+rxPanels[pi].subName+'</span>';
        chipBtn.setAttribute('aria-label',rxPanels[pi].subLabel);
        chipBtn.addEventListener('click',()=>rxsub(pi));
        subwrap.appendChild(chipBtn);
      });
      stepper.appendChild(subwrap);
    }
  });
}
function rxsub(n){
  if(!rxPanels[n]) return;
  currentRx = n;
  visitedPanels.add(n);
  setPhaseNav(rxPanels[n].kind==='finish'||rxPanels[n].kind==='connect' ? 'done' : 'prescription');
  rxPanels.forEach((p,i)=>{
    const panel = document.getElementById('rxsub'+i);
    panel.classList.toggle('on',i===n);
    panel.setAttribute('aria-hidden',i===n?'false':'true');
  });
  const lab = document.getElementById('rxLab');
  lab.replaceChildren();
  const chip = document.createElement('span');
  chip.className = 'sub-num'; chip.textContent = rxPanels[n].chip;
  lab.append(chip,document.createTextNode(rxPanels[n].heading||rxPanels[n].lab));
  if(rxPanels[n].badge){
    const badge = document.createElement('span');
    badge.className = 'rx-badge'; badge.textContent = '추천';
    lab.append(badge);
  }
  const subtitle = document.getElementById('rxSubtitle');
  if(rxPanels[n].subLabel){
    subtitle.innerHTML = rxPanels[n].subTags
      ? '<span>'+rxPanels[n].subLabel+'</span><span class="method-tags">'+rxPanels[n].subTags.map(platformTag).join('')+'</span>'
      : rxPanels[n].subLabel;
    subtitle.hidden = false;
  }
  else subtitle.hidden = true;

  document.querySelectorAll('.step-node').forEach(button=>{
    const idxs = button.dataset.panels.split(',').map(Number);
    const active = idxs.includes(n);
    const allVisited = idxs.every(i=>visitedPanels.has(i));
    button.classList.toggle('active',active);
    button.classList.toggle('visited',allVisited);
    if(active) button.setAttribute('aria-current','step'); else button.removeAttribute('aria-current');
    button.querySelector('.step-index').textContent = allVisited&&!active ? '✓' : button.dataset.num;
    const subs = button.nextElementSibling;
    if(subs && subs.classList.contains('step-subs')) subs.hidden = !active;
  });
  document.querySelectorAll('.step-subchip').forEach(chipBtn=>{
    const i = +chipBtn.dataset.step;
    chipBtn.classList.toggle('active',i===n);
    chipBtn.classList.toggle('visited',visitedPanels.has(i)&&i!==n);
    if(i===n) chipBtn.setAttribute('aria-current','step'); else chipBtn.removeAttribute('aria-current');
  });
  const stToggle = document.getElementById('stepperToggle');
  if(stToggle){
    const activeNode = document.querySelector('.step-node.active');
    if(activeNode){
      const tStrong = activeNode.querySelector('.step-copy strong').textContent;
      const tSmall = rxPanels[n].subNum ? (rxPanels[n].subNum+' · '+rxPanels[n].subName) : activeNode.querySelector('.step-copy small').textContent;
      stToggle.innerHTML = '<span class="step-index" aria-hidden="true">'+activeNode.dataset.num+'</span><span class="stepper-toggle-copy"><strong>'+tStrong+'</strong><small>'+tSmall+'</small></span><svg class="stepper-caret" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    }
    stToggle.closest('.result-summary').classList.remove('steps-open');
    stToggle.setAttribute('aria-expanded','false');
  }
  syncNavLabels(n);
  const deckEls = panelDeckEls(n);
  track('step', Object.assign(
    {step: n+1, step_total: rxPanels.length},
    deckEls ? {slide: deckIndex(deckEls)+1, slide_total: deckEls.slides.length} : {}
  ));
  if(rxPanels[n].kind==='connect'&&!connectViewed){
    connectViewed = true;
    track('view_connect');
  }
  if(rxPanels[n].kind==='finish'||rxPanels[n].kind==='connect') trackComplete();
  rxScrollTo();
  rxRevealed = true;
  requestAnimationFrame(()=>lab.focus({preventScroll:true}));
}
document.getElementById('stepperToggle').addEventListener('click',()=>{
  const stSummary = document.getElementById('stepperToggle').closest('.result-summary');
  const stOpen = stSummary.classList.toggle('steps-open');
  document.getElementById('stepperToggle').setAttribute('aria-expanded', stOpen?'true':'false');
});

  if(r.guide) html += '<a class="guide-link" href="'+GUIDE[r.guide[0]]+'" target="_blank" rel="noopener" onclick="track(\'click_guide\',{g:\''+r.guide[0]+'\'})">'+r.guide[1]+'</a>';
  div.innerHTML = html;
  return div;
}
function rediagnose(){
  track('rediagnose');
  try{ localStorage.removeItem(LS_KEY); }catch(e){}
  state = {};
  document.querySelectorAll('.chkrow input').forEach(input=>{
    input.checked = false;
    input.dispatchEvent(new Event('change',{bubbles:true}));
  });
  document.querySelectorAll('.chkrow').forEach(row=>row.classList.remove('on'));
  updateDiagHelp();
  visitedPanels = new Set();
  currentRx = 0;
  connectViewed = false;
  show('diag');
  window.scrollTo({top:0,behavior:reduceMotion.matches?'auto':'smooth'});
  requestAnimationFrame(()=>document.querySelector('.chkrow input').focus({preventScroll:true}));
}

/* ═══════════ 유틸 (A-1과 동일) ═══════════ */
function setPhaseNav(stage){
  const diag = document.getElementById('phaseDiag');
  const result = document.getElementById('phaseResult');
  const done = document.getElementById('phaseDone');
  const isDiag = stage==='diag';
  const isDone = stage==='done';
  diag.classList.toggle('active',isDiag);
  diag.classList.toggle('done',!isDiag);
  result.classList.toggle('active',stage==='prescription');
  result.classList.toggle('done',isDone);
  done.classList.toggle('active',isDone);
  done.classList.remove('done');
  [diag,result,done].forEach(phase=>phase.removeAttribute('aria-current'));
  (isDiag ? diag : isDone ? done : result).setAttribute('aria-current','step');
}
function show(id){
  ['diag','result'].forEach(s=>{
    const screen = document.getElementById('scr-'+s);
    screen.classList.toggle('active',s===id);
    screen.setAttribute('aria-hidden',s===id?'false':'true');
  });
  setPhaseNav(id==='diag' ? 'diag' : 'prescription');
  window.scrollTo({top:0,behavior:'auto'});
}
function writeClipboard(text){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text).catch(()=>legacyCopy(text));
  }
  return legacyCopy(text);
}
function legacyCopy(text){
  return new Promise((resolve,reject)=>{
    const area = document.createElement('textarea');
    area.value = text; area.setAttribute('readonly','');
    area.style.cssText = 'position:fixed;opacity:0;pointer-events:none';
    document.body.appendChild(area); area.select();
    const copied = document.execCommand('copy');
    area.remove();
    copied ? resolve() : reject(new Error('copy failed'));
  });
}
function copyTmpl(id, name, button){
  writeClipboard(document.getElementById(id).textContent).then(()=>{
    track('template_copy',{tmpl:name});
    toast(name+' 문구를 복사했어요');
    if(button){
      const old = button.textContent;
      button.textContent = '복사됨 ✓'; button.classList.add('copied');
      setTimeout(()=>{ button.textContent=old; button.classList.remove('copied'); },1800);
    }
  }).catch(()=>toast('복사하지 못했어요. 문구를 길게 눌러 선택해 주세요.'));
}
let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}

/* 스크린샷은 필요할 때만 크게 확인 */
let lastImageFocus = null;
function initCarousels(scope){
  scope.querySelectorAll('[data-carousel]').forEach(carousel=>{
    const track = carousel.querySelector('.carousel-track');
    const slides = Array.from(carousel.querySelectorAll('.carousel-slide'));
    const prev = carousel.querySelector('.carousel-arrow.prev');
    const next = carousel.querySelector('.carousel-arrow.next');
    const caption = carousel.nextElementSibling&&carousel.nextElementSibling.classList.contains('carousel-caption') ? carousel.nextElementSibling : null;
    let index = 0;
    const goTo = n=>{
      index = Math.max(0, Math.min(n, slides.length-1));
      track.style.transform = 'translateX(-'+(index*100)+'%)';
      if(prev) prev.hidden = index===0;
      if(next) next.hidden = index===slides.length-1;
      if(caption) caption.textContent = slides[index].dataset.caption||'';
    };
    if(prev) prev.addEventListener('click',()=>goTo(index-1));
    if(next) next.addEventListener('click',()=>goTo(index+1));
    goTo(0);
  });
}
function enhanceShots(scope){
  scope.querySelectorAll('img.shot,.carousel-slide:not([data-carousel-clone]) .carousel-image').forEach(img=>{
    img.tabIndex = 0;
    img.setAttribute('role','button');
    img.setAttribute('aria-label',(img.alt||'안내 이미지')+' 크게 보기');
    img.addEventListener('click',()=>openImage(img));
    img.addEventListener('keydown',e=>{
      if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openImage(img); }
    });
  });
  scope.querySelectorAll('.shot-svg').forEach(wrapper=>{
    const svg = wrapper.querySelector('svg');
    wrapper.tabIndex = 0;
    wrapper.setAttribute('role','button');
    wrapper.setAttribute('aria-label',((svg&&svg.getAttribute('aria-label'))||'안내 이미지')+' 크게 보기');
    wrapper.addEventListener('click',()=>openSvgDialog(wrapper));
    wrapper.addEventListener('keydown',e=>{
      if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openSvgDialog(wrapper); }
    });
  });
}
function openDialog(trigger){
  const dialog = document.getElementById('imageDialog');
  lastImageFocus = trigger;
  dialog.hidden = false;
  document.getElementById('main').inert = true;
  document.querySelector('.topbar').inert = true;
  document.body.style.overflow = 'hidden';
  dialog.querySelector('.dialog-close').focus();
}
function openImage(img){
  const enlarged = document.getElementById('dialogImage');
  const svgHost = document.getElementById('dialogSvg');
  svgHost.replaceChildren();
  svgHost.hidden = true;
  enlarged.hidden = false;
  enlarged.src = img.src; enlarged.alt = img.alt;
  openDialog(img);
}
function remapSvgIds(svg){
  const idMap = new Map();
  const idNodes = [svg,...svg.querySelectorAll('[id]')].filter(node=>node.id);
  idNodes.forEach(node=>{
    const oldId = node.id;
    const newId = oldId+'-zoom';
    idMap.set(oldId,newId);
    node.id = newId;
  });
  [svg,...svg.querySelectorAll('*')].forEach(node=>{
    Array.from(node.attributes).forEach(attr=>{
      let value = attr.value;
      idMap.forEach((newId,oldId)=>{
        value = value.split('url(#'+oldId+')').join('url(#'+newId+')');
        if(value==='#'+oldId) value = '#'+newId;
      });
      if(attr.name==='aria-labelledby'||attr.name==='aria-describedby'){
        value = value.split(/\s+/).map(id=>idMap.get(id)||id).join(' ');
      }
      if(value!==attr.value) node.setAttribute(attr.name,value);
    });
  });
}
function openSvgDialog(wrapper){
  const source = wrapper.querySelector('svg');
  if(!source) return;
  const clone = source.cloneNode(true);
  remapSvgIds(clone);
  const svgHost = document.getElementById('dialogSvg');
  const enlarged = document.getElementById('dialogImage');
  svgHost.replaceChildren(clone);
  svgHost.hidden = false;
  enlarged.hidden = true;
  enlarged.removeAttribute('src');
  openDialog(wrapper);
}
function closeImage(){
  const dialog = document.getElementById('imageDialog');
  if(dialog.hidden) return;
  dialog.hidden = true;
  const svgHost = document.getElementById('dialogSvg');
  svgHost.replaceChildren();
  svgHost.hidden = true;
  const enlarged = document.getElementById('dialogImage');
  enlarged.removeAttribute('src');
  enlarged.hidden = false;
  document.getElementById('main').inert = false;
  document.querySelector('.topbar').inert = false;
  document.body.style.overflow = '';
  if(lastImageFocus) lastImageFocus.focus();
}
document.getElementById('imageDialog').addEventListener('click',e=>{
  if(e.target.id==='imageDialog') closeImage();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') closeImage();
  if(e.key==='Tab'&&!document.getElementById('imageDialog').hidden){
    e.preventDefault(); document.querySelector('.dialog-close').focus();
  }
});

function updateDiagHelp(){
  const selected = checked();
  const help = document.getElementById('diagHelp');
  if(selected.includes('none')) help.textContent = '괜찮아요 — 처음부터 차례로 안내해 드릴게요';
  else if(selected.length) help.innerHTML = '<strong>'+selected.length+'가지 확인했어요.</strong> 이미 한 일은 처방에서 빼드릴게요.';
  else help.textContent = '선택하지 않아도 괜찮아요. 처음부터 안내해 드릴게요.';
}

/* 체크박스: 스타일 토글 + '아무데도'는 배타 선택 */
document.querySelectorAll('.chkrow').forEach(row=>{
  row.addEventListener('change', ()=>{
    const ch = row.dataset.ch, input = row.querySelector('input');
    if(input.checked){
      if(ch==='none'){
        document.querySelectorAll('.chkrow').forEach(r=>{
          if(r.dataset.ch!=='none'){ r.querySelector('input').checked=false; r.classList.remove('on'); }
        });
      }else{
        const none = document.querySelector('.chkrow[data-ch="none"]');
        none.querySelector('input').checked=false; none.classList.remove('on');
      }
      track('diag_check',{channel:ch});
    }
    row.classList.toggle('on', input.checked);
    updateDiagHelp();
  });
});

/* ═══════════ 초기 진입 ═══════════ */
track('view_kit');
if(state.done){        /* 재방문: 이전 답 복원 */
  state.done.forEach(c=>{
    const row = document.querySelector('.chkrow[data-ch="'+c+'"]');
    if(row){ row.querySelector('input').checked=true; row.classList.add('on'); }
  });
}
updateDiagHelp();
show('diag');
</script>
